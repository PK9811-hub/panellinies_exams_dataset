task: panellinies_economics_open
dataset_path: ilsp/panellinies-exams-dataset
output_type: generate_until
test_split: train
fewshot_split: dev
num_fewshot: 5
process_docs: !function utils.process_economics_open
doc_to_text: !function utils.doc_to_text_open
doc_to_target: !function utils.doc_to_target_open
process_results: !function utils.process_results_gen
generation_kwargs:
  do_sample: false
  temperature: 0.0
  max_gen_toks: 512
  until: 
    - "Ερώτηση:"
    - "---"
metric_list:
  - metric: bertscore_f1_max
    aggregation: mean
    higher_is_better: true