task: panellinies_physics_closed
dataset_path: ilsp/panellinies-exams-dataset
output_type: generate_until
test_split: train
#fewshot_split: dev
#num_fewshot: 5
process_docs: !function utils.process_physics_closed
doc_to_text: !function utils.doc_to_text_closed
doc_to_target: !function utils.doc_to_target
generation_kwargs:
  do_sample: false
  temperature: 0.0
  max_gen_toks: 10 
  until: 
    - "Ερώτηση:"
    - "\n"
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true